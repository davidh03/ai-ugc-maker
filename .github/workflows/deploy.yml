# Phase 5 of docs/plans/aws-production-hosting-cicd.md: build+tag on push to
# main, push to ECR, deploy the exact SHA to EC2 via SSM, health-check it,
# and roll back to the previous image if the health check fails.
#
# Disabled by default (see the `if:` guard below) until the AWS foundation
# in Phase 3 actually exists — an ECR repo, an EC2 instance with the SSM
# agent, and an IAM role for GitHub OIDC to assume. Flip
# vars.AWS_DEPLOY_ENABLED to "true" in the repo's Settings > Environments
# once those are provisioned; until then this workflow no-ops instead of
# failing on every push. See docs/deploy/README.md for the full checklist
# of secrets/variables this workflow expects.

name: Deploy

# Triggered by CI finishing (not by push directly) so a push that fails
# tests/lint/build never reaches a deploy attempt.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: DEBUG decode OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq . || echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -f deploy/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy SHA to EC2 and record the previous tag for rollback
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # Read the tag currently running before we touch anything, so a
          # failed health check below has something concrete to roll back
          # to — not just "latest", which by the time we'd need it will
          # already point at the broken build.
          PREVIOUS_TAG=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker inspect --format \"{{index .Config.Labels \\\"deploy.image_tag\\\"}}\" $(docker compose -f /opt/ai-ugc-maker/deploy/docker-compose.production.yml ps -q app) 2>/dev/null || echo none"]' \
            --query "Command.CommandId" --output text)
          sleep 5
          PREVIOUS_TAG_VALUE=$(aws ssm get-command-invocation --command-id "$PREVIOUS_TAG" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text | tr -d '[:space:]')
          echo "previous_tag=${PREVIOUS_TAG_VALUE:-none}" >> "$GITHUB_OUTPUT"

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          DEPLOY_CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /opt/ai-ugc-maker && IMAGE=$IMAGE IMAGE_TAG=$IMAGE_TAG docker compose -f deploy/docker-compose.production.yml pull && IMAGE=$IMAGE IMAGE_TAG=$IMAGE_TAG docker compose -f deploy/docker-compose.production.yml up -d\"]" \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$DEPLOY_CMD" --instance-id "$INSTANCE_ID" || true

      - name: Health check the new deployment
        id: health
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          for attempt in $(seq 1 10); do
            CMD=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["curl -sf http://127.0.0.1:8787/api/ready"]' \
              --query "Command.CommandId" --output text)
            sleep 6
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" --query "Status" --output text)
            if [ "$STATUS" = "Success" ]; then echo "healthy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 4
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Roll back to the previous image on a failed health check
        if: failure() && steps.deploy.outputs.previous_tag != '' && steps.deploy.outputs.previous_tag != 'none'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PREVIOUS_TAG: ${{ steps.deploy.outputs.previous_tag }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          PREVIOUS_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$PREVIOUS_TAG"
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /opt/ai-ugc-maker && IMAGE=$PREVIOUS_IMAGE IMAGE_TAG=$PREVIOUS_TAG docker compose -f deploy/docker-compose.production.yml up -d\"]"
          echo "::error::Deploy of ${{ github.event.workflow_run.head_sha }} failed its health check — rolled back to $PREVIOUS_TAG"
