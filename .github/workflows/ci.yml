name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Backend tests
        run: npm test
        working-directory: server

      - name: Frontend lint
        run: npm run lint
        working-directory: web

      - name: Frontend build
        run: npm run build
        working-directory: web

      - name: Whitespace / conflict-marker check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
