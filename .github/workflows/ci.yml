name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # aiReviewer.test.js and assetAnalyzer.test.js shell out to real
      # ffmpeg/ffprobe/ImageMagick `identify` against fixture media — ubuntu-latest
      # doesn't have these by default. Found by an actual failing run on
      # GitHub (spawnSync ffmpeg ENOENT), not by reading the Dockerfile.
      - name: Install ffmpeg + ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg imagemagick

      - name: Install root deps
        run: npm ci

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Backend tests
        run: npm test
        working-directory: server

      - name: Frontend lint
        run: npm run lint
        working-directory: web

      - name: Frontend build
        run: npm run build
        working-directory: web

      - name: Whitespace / conflict-marker check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
